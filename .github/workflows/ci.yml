name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  checks:
    name: Tipos, pruebas, lint y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ascendx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ascendx_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ascendx_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-que-tiene-mas-de-32-caracteres-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci también compila packages/finance-core (script prepare)
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Tipos (todos los paquetes)
        run: npm run typecheck
      - name: finance-core con cobertura ≥ 90 % (RNF-09)
        run: npm run test:coverage
      - name: Pruebas unitarias de la API
        run: npm test -w @ascendx/api
      - name: Migraciones y pruebas de integración
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npm run test:int
      - name: Lint de la app
        run: npm run lint
      - name: Build de la API
        run: npm run build -w @ascendx/api
      - name: Auditoría de dependencias (informativa)
        run: npm audit --omit=dev --audit-level=critical || true
